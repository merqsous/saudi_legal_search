<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الباحث — تيك توك</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Tajawal', sans-serif;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .tiktok-card {
    width: 1080px;
    height: 1920px;
    background: linear-gradient(160deg, #147A4D 0%, #0a3d22 40%, #052815 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 70px;
  }

  /* Decorative shapes */
  .shape-1 {
    position: absolute;
    top: -200px;
    left: -200px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(46,125,79,0.25) 0%, transparent 70%);
    border-radius: 50%;
  }
  .shape-2 {
    position: absolute;
    bottom: -150px;
    right: -150px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(46,125,79,0.2) 0%, transparent 70%);
    border-radius: 50%;
  }
  .shape-3 {
    position: absolute;
    top: 40%;
    right: -100px;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 70%);
    border-radius: 50%;
  }

  /* Logo */
  .logo-container {
    padding: 30px 50px;
    border-radius: 36px;
    background: #fff;
    border-radius: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 50px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    z-index: 2;
  }
  .logo-text {
    font-size: 80px;
    font-weight: 900;
    color: #147A4D;
  }

  /* Hook */
  .hook {
    font-size: 72px;
    font-weight: 900;
    color: #fff;
    text-align: center;
    line-height: 1.3;
    margin-bottom: 40px;
    z-index: 2;
    text-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .hook .highlight {
    color: #4CAF50;
  }

  /* Subtitle */
  .subtitle {
    font-size: 42px;
    font-weight: 700;
    color: #B8D4C0;
    text-align: center;
    line-height: 1.5;
    margin-bottom: 60px;
    z-index: 2;
  }

  /* Features list */
  .features {
    display: flex;
    flex-direction: column;
    gap: 28px;
    z-index: 2;
    margin-bottom: 60px;
    width: 100%;
    max-width: 850px;
  }
  .feature {
    display: flex;
    align-items: center;
    gap: 24px;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(76,175,80,0.3);
    border-radius: 24px;
    padding: 28px 36px;
    backdrop-filter: blur(10px);
  }
  .feature-icon {
    width: 64px;
    height: 64px;
    background: #147A4D;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    flex-shrink: 0;
  }
  .feature-text {
    font-size: 36px;
    font-weight: 700;
    color: #fff;
  }

  /* CTA */
  .cta-box {
    background: #fff;
    border-radius: 28px;
    padding: 36px 60px;
    z-index: 2;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .cta-text {
    font-size: 48px;
    font-weight: 900;
    color: #147A4D;
    text-align: center;
  }
  .cta-url {
    font-size: 32px;
    font-weight: 700;
    color: #147A4D;
    text-align: center;
    margin-top: 8px;
    direction: ltr;
  }

  /* Bottom badge */
  .badge {
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    color: rgba(255,255,255,0.5);
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="tiktok-card">
    <div class="shape-1"></div>
    <div class="shape-2"></div>
    <div class="shape-3"></div>

    <div class="logo-container" style="background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
      <span style="font-size: 64px; font-weight: 900; color: #147A4D;">الباحث</span>
    </div>

    <div class="hook">
      تضيّع ساعات <span class="highlight">تدور على حكم قضائي؟</span>
    </div>

    <div class="subtitle">
      محرك بحث ذكي في الأحكام القضائية السعودية<br>
      ابحث، حلّل، وصدّر — كله في مكان واحد
    </div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">🔍</div>
        <div class="feature-text">بحث ذكي في أحكام المحاكم السعودية</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🤖</div>
        <div class="feature-text">دراسة قانونية بالذكاء الاصطناعي</div>
      </div>
      <div class="feature">
        <div class="feature-icon">📄</div>
        <div class="feature-text">تصدير Word و PDF بضغطة زر</div>
      </div>
    </div>

    <div class="cta-box">
      <div class="cta-text">جرّب الباحث الآن</div>
      <div class="cta-url">albaheth.app</div>
    </div>

    <div class="badge">الباحث — بحث ذكي في الأحكام القضائية السعودية</div>
  </div>
</body>
</html>
