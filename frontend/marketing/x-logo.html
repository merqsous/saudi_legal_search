<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الباحث — X Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Tajawal', sans-serif;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .x-logo {
    width: 400px;
    height: 400px;
    background: #147A4D;
    border-radius: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .x-logo span {
    font-size: 130px;
    font-weight: 900;
    color: #fff;
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="x-logo">
    <span>الباحث</span>
  </div>
</body>
</html>
