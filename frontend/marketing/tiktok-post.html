<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الباحث — TikTok Post</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Tajawal', sans-serif;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 1350px;
  }
  .post {
    width: 1080px;
    height: 1350px;
    background: #147A4D;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 70px;
  }
  .circle-bg {
    position: absolute;
    top: -300px;
    right: -300px;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
    border-radius: 50%;
  }
  .circle-bg2 {
    position: absolute;
    bottom: -200px;
    left: -200px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 70%);
    border-radius: 50%;
  }
  .logo {


    width: 120px;
    height: 120px;
    border-radius: 28px;
    margin-bottom: 40px;
    z-index: 2;
  }
  .headline {
    font-size: 80px;
    font-weight: 900;
    color: #fff;
    text-align: center;
    line-height: 1.3;
    margin-bottom: 30px;
    z-index: 2;
  }
  .sub {
    font-size: 44px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    text-align: center;
    line-height: 1.5;
    margin-bottom: 50px;
    z-index: 2;
  }
  .features {
    display: flex;
    flex-direction: column;
    gap: 24px;
    z-index: 2;
    width: 100%;
    max-width: 850px;
    margin-bottom: 50px;
  }
  .feature {
    display: flex;
    align-items: center;
    gap: 28px;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    padding: 26px 36px;
  }
  .feature-icon {
    width: 72px;
    height: 72px;
    background: #fff;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    flex-shrink: 0;
  }
  .feature-text {
    font-size: 40px;
    font-weight: 700;
    color: #fff;
  }
  .cta {
    background: #fff;
    border-radius: 28px;
    padding: 36px 70px;
    z-index: 2;
  }
  .cta-text {
    font-size: 52px;
    font-weight: 900;
    color: #147A4D;
    text-align: center;
  }
  .cta-url {
    font-size: 34px;
    font-weight: 700;
    color: #147A4D;
    text-align: center;
    margin-top: 8px;
    direction: ltr;
  }
</style>
</head>
<body>
  <div class="post">
    <div class="circle-bg"></div>
    <div class="circle-bg2"></div>

    <img src="logo-rounded.png" alt="الباحث" class="logo" />

    <div class="headline">بحث الأحكام القضائية<br>صار أسهل</div>
    <div class="sub">محرك بحث ذكي في الأحكام القضائية السعودية<br>ابحث، حلّل، وصدّر — كله في مكان واحد</div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">🔍</div>
        <div class="feature-text">بحث ذكي في أحكام المحاكم السعودية</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🤖</div>
        <div class="feature-text">دراسة قانونية بالذكاء الاصطناعي</div>
      </div>
      <div class="feature">
        <div class="feature-icon">📄</div>
        <div class="feature-text">تصدير Word و PDF بضغطة زر</div>
      </div>
    </div>

    <div class="cta">
      <div class="cta-text">جرّب الباحث الآن</div>
      <div class="cta-url">albaheth.app</div>
    </div>
  </div>
</body>
</html>
